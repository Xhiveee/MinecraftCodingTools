name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check tag version
        run: node --input-type=module -e "import fs from 'node:fs'; if (process.env.GITHUB_REF_NAME !== 'v' + JSON.parse(fs.readFileSync('package.json')).version) process.exit(1)"
      - run: npm run typecheck
      - run: npm test
      - run: npm run release
      - run: npm run verify:release
      - run: gh release create "$GITHUB_REF_NAME" releases/* --title "MinecraftCodingTools $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
